<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>優待候補ダッシュボード</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="header-top">
      <h1>優待候補</h1>
      <p class="updated-at" id="updatedAt"></p>
    </div>
    <input type="search" id="searchBox" class="search-box" placeholder="銘柄名・コードで検索">
    <div class="sort-buttons">
      <button type="button" data-sort="code" class="active">コード順</button>
      <button type="button" data-sort="change">前日比が低い順</button>
      <button type="button" data-sort="profit">儲けが低い順</button>
    </div>
    <div class="col-header">
      <span class="col-name">銘柄</span>
      <span class="col-num">取得値</span>
      <span class="col-num">現在</span>
      <span class="col-num">前日比</span>
      <span class="col-num">儲け</span>
      <span class="col-toggle"></span>
    </div>
  </div>
</header>

<main id="rowList" class="row-list">
  <p class="loading">読み込み中...</p>
</main>

<template id="rowTemplate">
  <article class="row">
    <button class="row-summary" type="button">
      <span class="col-name">
        <span class="row-code"></span><span class="row-name"></span>
      </span>
      <span class="col-num row-acq"></span>
      <span class="col-num row-current"></span>
      <span class="col-num row-change"></span>
      <span class="col-num row-profit"></span>
      <span class="col-toggle">▼</span>
    </button>
    <div class="row-detail" hidden>
      <dl class="detail-list">
        <dt>市場</dt><dd class="detail-market"></dd>
        <dt>配当月</dt><dd class="detail-div-month"></dd>
        <dt>配当金</dt><dd class="detail-div-amount"></dd>
        <dt>優待月</dt><dd class="detail-yutai-month"></dd>
        <dt>優待内容</dt><dd class="detail-yutai-content"></dd>
      </dl>
      <div class="period-buttons">
        <button type="button" data-period="1m">1か月</button>
        <button type="button" data-period="1y" class="active">1年</button>
        <button type="button" data-period="5y">5年</button>
        <button type="button" data-period="10y">10年</button>
      </div>
      <div class="chart-wrap">
        <canvas></canvas>
      </div>
      <p class="chart-status"></p>
    </div>
  </article>
</template>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
