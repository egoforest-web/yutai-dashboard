name: Update today price

on:
  schedule:
    # 平日の JST 11:45(昼休み中=前場引け値)と JST 15:45(大引け後)の2回。
    # 東証は昼休み11:30-12:30・大引け15:30。昼休み中はどの時刻に取っても
    # 同じ前場引け値になるため、以前の11:30と12:07は冗長だった。
    # 毎時00分はワークフローが集中して遅延しやすいので:45に寄せている。
    - cron: "45 2 * * 1-5"
    - cron: "45 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-today:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch today price
        run: python scripts/fetch_today.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/today.json; then
            echo "no change"
          else
            git add data/today.json
            git commit -m "chore: update today.json"
            git push
          fi
