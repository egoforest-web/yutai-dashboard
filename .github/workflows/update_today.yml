name: Update today price

on:
  schedule:
    # 平日の JST 11:30 / 12:00(前場引け)と JST 15:40(大引け後)の3回。
    # 東証の昼休みは11:30-12:30、大引けは15:30。GitHub Actions のcronは
    # 数分〜十数分遅れることがあるため、確定した終値を取れるよう15:40に寄せている。
    # 11:30の回は、GitHub Pagesの10分キャッシュを見込んで
    # 12:00時点で前場引け値が見えている状態にするためのもの。
    - cron: "30 2 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "40 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-today:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch today price
        run: python scripts/fetch_today.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/today.json; then
            echo "no change"
          else
            git add data/today.json
            git commit -m "chore: update today.json"
            git push
          fi
